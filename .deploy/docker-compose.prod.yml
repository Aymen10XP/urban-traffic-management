services:
  postgres:
    image: postgres:15
    container_name: traffic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traffic-network

  redis:
    image: redis:7-alpine
    container_name: traffic_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLIC_PORT:-6379}:6379"
    networks:
      - traffic-network

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-auth-service:${IMAGE_TAG:-latest}
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - traffic-network

  vehicle-service:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-vehicle-service:${IMAGE_TAG:-latest}
    container_name: vehicle-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - postgres
    networks:
      - traffic-network

  traffic-service:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-traffic-service:${IMAGE_TAG:-latest}
    container_name: traffic-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      - postgres
    networks:
      - traffic-network

  incident-service:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-incident-service:${IMAGE_TAG:-latest}
    container_name: incident-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      - postgres
    networks:
      - traffic-network

  notification-service:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-notification-service:${IMAGE_TAG:-latest}
    container_name: notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      - postgres
      - redis
    networks:
      - traffic-network

  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/urban-traffic-management-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:3001/graphql
      VEHICLE_SERVICE_URL: http://vehicle-service:3002/graphql
      TRAFFIC_SERVICE_URL: http://traffic-service:3003/graphql
      INCIDENT_SERVICE_URL: http://incident-service:3004/graphql
      NOTIFICATION_SERVICE_URL: http://notification-service:3005/graphql
    ports:
      - "${GATEWAY_PUBLIC_PORT:-4000}:4000"
    depends_on:
      - auth-service
      - vehicle-service
      - traffic-service
      - incident-service
      - notification-service
    networks:
      - traffic-network

volumes:
  postgres_data:

networks:
  traffic-network:
    driver: bridge
