name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: auth-service
            path: Services/auth-service
          - name: vehicle-service
            path: Services/vehicle-service
          - name: traffic-service
            path: Services/traffic-service
          - name: incident-service
            path: Services/incident-service
          - name: notification-service
            path: Services/notification-service
          - name: api-gateway
            path: api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: auth-service
            path: Services/auth-service
          - name: vehicle-service
            path: Services/vehicle-service
          - name: traffic-service
            path: Services/traffic-service
          - name: incident-service
            path: Services/incident-service
          - name: notification-service
            path: Services/notification-service
          - name: api-gateway
            path: api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

  docker:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: auth-service
            context: ./Services/auth-service
            dockerfile: ./Services/auth-service/Dockerfile
          - name: vehicle-service
            context: ./Services/vehicle-service
            dockerfile: ./Services/vehicle-service/Dockerfile
          - name: traffic-service
            context: ./Services/traffic-service
            dockerfile: ./Services/traffic-service/Dockerfile
          - name: incident-service
            context: ./Services/incident-service
            dockerfile: ./Services/incident-service/Dockerfile
          - name: notification-service
            context: ./Services/notification-service
            dockerfile: ./Services/notification-service/Dockerfile
          - name: api-gateway
            context: ./api-gateway
            dockerfile: ./api-gateway/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/urban-traffic-management-${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Docker host
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH }}/.deploy"

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: ".deploy/docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy updated containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose --env-file .deploy/.env -f .deploy/docker-compose.prod.yml pull
            docker compose --env-file .deploy/.env -f .deploy/docker-compose.prod.yml up -d
            docker image prune -f
